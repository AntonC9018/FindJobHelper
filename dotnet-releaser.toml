# Lockstep family for the 1.0.0-test local-feed release (fjw-w4u.2, fjw-w4u.8):
# Configuration, Configuration.Json, Core, Generation, Cli, Templates, WebUi.
# The WebUi sources live here as src/FindJobHelper.WebUi (canonical copy for
# packaging, moved from the workspace repo); the workspace branch keeps its
# own copy until cutover.
profile = "custom"

[msbuild]
project = [
  "src/FindJobHelper.Configuration/FindJobHelper.Configuration.csproj",
  "src/FindJobHelper.Configuration.Json/FindJobHelper.Configuration.Json.csproj",
  "src/FindJobHelper.Core/FindJobHelper.Core.csproj",
  "src/FindJobHelper.Generation/FindJobHelper.Generation.csproj",
  "templates/FindJobWorkspace/Anton.FindJobHelper.Templates.csproj",
  "src/FindJobHelper.Cli/FindJobHelper.Cli.csproj",
  "src/FindJobHelper.WebUi/FindJobHelper.WebUi.csproj",
]
configuration = "Release"

[msbuild.properties]
ContinuousIntegrationBuild = true

[test]
enable = false
run_tests = false
run_tests_for_debug = false

[github]
user = "AntonC9018"
repo = "FindJobHelper"
version_prefix = "v"
branches = ["main"]

[nuget]
trusted_publishing = true
user = "AntonC9018"
