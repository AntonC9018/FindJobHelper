name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Restore, build, test, and pack
    runs-on: ubuntu-latest
    env:
      CI_PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FindJobHelper.sln
      - run: dotnet build FindJobHelper.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test without external LaTeX integration
        run: dotnet test FindJobHelper.sln -c Release --no-build --no-restore --filter 'FullyQualifiedName!~LatexMeasurementTests&FullyQualifiedName!~CvGenerationCliEndToEndTests'
      - name: Pack non-publishable CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-staging
          common=(-c Release --no-build --no-restore -o package-staging -p:PackageVersion="$CI_PACKAGE_VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true)
          dotnet pack src/FindJobHelper.Core/FindJobHelper.Core.csproj "${common[@]}"
          dotnet pack templates/FindJobWorkspace/Anton.FindJobHelper.Templates.csproj "${common[@]}"
          dotnet pack src/FindJobHelper.Cli/FindJobHelper.Cli.csproj "${common[@]}"
          unzip -p "package-staging/Anton.FindJobHelper.Templates.$CI_PACKAGE_VERSION.nupkg" content/scripts/setup-latex.sh > packaged-setup-latex.sh
          cmp scripts/setup-latex.sh packaged-setup-latex.sh

  latex-real-render:
    name: LaTeX setup, check, idempotency, and real render
    runs-on: ubuntu-latest
    env:
      CI_PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
      PersonalInfo__FirstName: Alex
      PersonalInfo__LastName: Example
      PersonalInfo__Profession: Example Software Engineer
      PersonalInfo__City: Example City
      PersonalInfo__Country: Example Country
      PersonalInfo__Email: alex@example.test
      PersonalInfo__Phone: 202-555-0100
      PersonalInfo__GitHub: https://example.test/github
      PersonalInfo__LinkedIn: https://example.test/linkedin
      OpenApi__SecretKey: ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install and verify the canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup-latex.sh
          source "$HOME/.local/share/findjobhelper/texlive/2026/findjobhelper-env.sh"
          printf '%s\n' "$(dirname "$(command -v latexmk)")" >> "$GITHUB_PATH"
          ./scripts/setup-latex.sh --check
          ./scripts/setup-latex.sh
          ./scripts/setup-latex.sh --check
      - name: Build and run a fresh fictional Workspace
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore FindJobHelper.sln
          dotnet build FindJobHelper.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet test FindJobHelper.sln -c Release --no-build --no-restore
          mkdir package-staging workspace tool
          common=(-c Release --no-build --no-restore -o package-staging -p:PackageVersion="$CI_PACKAGE_VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true)
          dotnet pack src/FindJobHelper.Core/FindJobHelper.Core.csproj "${common[@]}"
          dotnet pack templates/FindJobWorkspace/Anton.FindJobHelper.Templates.csproj "${common[@]}"
          dotnet pack src/FindJobHelper.Cli/FindJobHelper.Cli.csproj "${common[@]}"
          dotnet new install "package-staging/Anton.FindJobHelper.Templates.$CI_PACKAGE_VERSION.nupkg"
          dotnet new findjob-workspace -n FictionalWorkspace -o workspace
          sed -i "s/\[0.1.0\]/[$CI_PACKAGE_VERSION]/g; s/version = \"0.1.0\"/version = \"$CI_PACKAGE_VERSION\"/g" workspace/src/FindJobWorkspace.Provider/FindJobWorkspace.Provider.csproj workspace/.config/dotnet-tools.json
          dotnet restore workspace/FictionalWorkspace.sln --source package-staging --source https://api.nuget.org/v3/index.json
          dotnet build workspace/FictionalWorkspace.sln -c Release --no-restore
          dotnet tool install --tool-path tool Anton.FindJobHelper.Cli --version "$CI_PACKAGE_VERSION" --add-source package-staging
          cp workspace/cv-config.example.json workspace/config.json
          ./tool/find-job-helper --config workspace/config.json --experience-database workspace/src/FindJobWorkspace.Provider/bin/Release/net10.0/FindJobWorkspace.Provider.dll --output-directory workspace/output --latex-bin-directory "$(dirname "$(command -v latexmk)")"
          test -s workspace/output/ExampleAlex.pdf
          test -s "$HOME/.local/share/findjobhelper/latex-height-cache.sqlite3"
