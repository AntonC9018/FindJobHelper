name: Publish synchronized NuGet release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    name: Verify main and publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful Main CI for the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          runs="$(gh run list \
            --workflow main-ci.yml \
            --branch main \
            --event push \
            --commit "$GITHUB_SHA" \
            --limit 20 \
            --json conclusion,headSha)"
          jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .headSha == $sha and .conclusion == "success")' \
            <<< "$runs"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore pinned release tool
        run: dotnet tool restore

      - name: Rebuild and publish the tagged release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet tool run dotnet-releaser run --github-token "$GITHUB_TOKEN" dotnet-releaser.toml
